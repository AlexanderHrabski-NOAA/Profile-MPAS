# Single 60 km run on 4 nodes (384 ranks), with Scalasca profiling.
# Run with:  ./build-and-run.py studies/60km.yaml
study: 60km

defaults:
  resolution: 60km
  tasks_per_node: 96
  profile: true
  walltime: "00:40:00"
  run_duration: "7_00:00:00"
  mpas:
    ref: MPAS-v8.4.2-1.19   # branch, tag, or hash; omit to use the submodule pin

experiments:
  - nodes: 4
